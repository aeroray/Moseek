    <!-- No webfont link here, on purpose.
         This used to load IBM Plex Sans and Space Grotesk from fonts.googleapis.com, which made
         the WebView contact a CDN before a single line of Rust could run — the one thing the
         network policy exists to prevent — and left first paint depending on how that connection
         failed on mainland-China networks. `--font-sans` in `src/index.css` still names both
         families first, so a machine that has them installed still uses them; everything else
         falls through to the system UI font. Reinstating them means self-hosting the .woff2 files
         and adding @font-face rules, never a remote stylesheet. -->
