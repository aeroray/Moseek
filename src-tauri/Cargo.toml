[package]
name = "moseek"
version = "0.1.0"
description = "Moseek desktop media resource console"
authors = ["Moseek"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Incremental compilation is disabled on purpose. On Windows, real-time antivirus
# scanning (observed with Huorong HIPS) intermittently denies writes inside
# `target/debug/incremental`, and rustc 1.98 panics instead of degrading when it
# cannot write incremental metadata. A full crate rebuild costs seconds here, while
# the incremental cache also grew past 7 GB before it was cleared.
[profile.dev]
incremental = false

[lints.rust]
# rustc 1.98 added the `linker_messages` lint, which surfaces whatever the linker prints on
# stdout. MSVC's `link.exe` always announces "正在创建库 … 和对象 …" when it writes a DLL's
# import library and export file, so every Windows build reports this as a warning even though
# nothing is wrong. Allowing the lint only silences that chatter: a real linker failure is an
# error and still stops the build.
linker_messages = "allow"

[dependencies]
base64 = "0.22"
# Decodes configuration text that is not UTF-8. Several of the addresses the user supplied serve GBK
# (and the picture-wrapper ones can carry any encoding inside), and rejecting those reported our
# encoding guess as the file's fault. Already present transitively via reqwest; declared explicitly
# because `config::decode` uses it directly.
encoding_rs = "0.8"
# Used to poll several live-stream probes concurrently instead of trying lines one by one.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.41"
scraper = { version = "0.27", default-features = false, features = ["errors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time` for the deadlines every fetch carries; `macros` for `select!`, which is how a cancelled
# source test drops its in-flight future — dropping it is what closes the socket, where a flag alone
# would only stop the code from *waiting*. `rt` is needed by `select!`'s generated code.
tokio = { version = "1", features = ["time", "macros", "rt"] }
tauri = { version = "2", features = [] }
# Supplies the native save dialog for "download this poster" and for exporting a configuration.
# Without a native picker the webview could only drop the file somewhere the user never chose.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app updates from GitHub Releases. The plugin verifies a minisign signature over the downloaded
# installer against the public key in `tauri.conf.json`, so a tampered or substituted asset fails
# verification instead of being installed.
tauri-plugin-updater = "2"
# Restarts the app after an update is installed, so the user is not left being told to restart by
# hand after the installer has already replaced the files.
tauri-plugin-process = "2"
