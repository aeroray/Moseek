name: Release

# Pushing a SemVer tag (for example v0.2.0) builds the installer, signs it, publishes a GitHub
# Release, and uploads `latest.json` for in-app updates.
#
# The same job can be run by hand against an existing tag. `workflow_dispatch` exists because a build
# can fail for a reason unrelated to the code (a runner image change, a transient network fault), and
# re-running it must not require deleting and re-pushing the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有的 SemVer 标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  # Required to create the Release and upload its assets.
  contents: write

jobs:
  release:
    # One row per artifact that ships. The macOS rows are split by architecture because the updater
    # manifest keys them separately (`darwin-aarch64` and `darwin-x86_64`), and a universal binary
    # would not tell an Intel Mac which slice to take.
    #
    # The rows do not clobber each other's `latest.json`: tauri-action reads the existing manifest and
    # merges its own platform entries into it (`upload-version-json.ts`), which is what makes a matrix
    # safe here rather than a last-writer-wins race.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # `matrix.target` is either a cross target or empty, so it can be passed through directly.
          # Only the macOS rows need one; asking elsewhere would download toolchains never used.
          targets: ${{ matrix.target }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A per-target cache, or the two macOS rows would fight over one directory.
          key: ${{ matrix.target || 'default' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Every place the version lives must agree before anything is built. If they drift, the app
      # reports one version, the installer carries another, and the updater compares against a third
      # — which shows up as "已是最新版本" on a build that is not, or as an update that reinstalls
      # itself forever. Failing here is much cheaper than shipping that.
      - name: Verify the version matches the tag
        run: |
          node scripts/sync-version.mjs
          node scripts/verify-release-version.mjs

      - name: Load release notes
        id: notes
        run: node scripts/load-release-notes.mjs

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of the minisign keypair whose public half is in tauri.conf.json. This
          # signs the *updater* payload, not the app bundle, and every platform needs it. It is not an
          # Apple certificate: the macOS build is ad-hoc signed (`signingIdentity: "-"`), which is what
          # lets a free open-source project ship a working macOS build with no paid developer account.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Moseek · 拾影 ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Off because the notes are authored in docs/releases/<tag>.md. Leaving it on risks GitHub
          # prepending an auto-generated commit list to them.
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          # Writes latest.json, the manifest the in-app updater reads.
          uploadUpdaterJson: true
          # No `--bundles` here: which bundles to produce is per-platform, and that lives in
          # tauri.windows.conf.json and tauri.macos.conf.json so the CLI picks them up automatically.
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
