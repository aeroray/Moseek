[package]
name = "moseek"
version = "0.1.0"
description = "Moseek desktop media resource console"
authors = ["Moseek"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Incremental compilation is disabled on purpose. On Windows, real-time antivirus
# scanning (observed with Huorong HIPS) intermittently denies writes inside
# `target/debug/incremental`, and rustc 1.98 panics instead of degrading when it
# cannot write incremental metadata. A full crate rebuild costs seconds here, while
# the incremental cache also grew past 7 GB before it was cleared.
[profile.dev]
incremental = false

[dependencies]
base64 = "0.22"
# Used to poll several live-stream probes concurrently instead of trying lines one by one.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.41"
scraper = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
